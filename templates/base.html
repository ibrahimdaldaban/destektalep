<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Günlük Uygulaması</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        .navbar {
            background: linear-gradient(90deg, #f44336, #f44336);
            padding: 0.5rem 1rem;
        }
        .navbar-brand img {
            height: 40px;
        }
        .nav-link {
            color: white !important;
            font-weight: bold;
            margin-right: 1rem;
        }
        .nav-link:hover {
            border-bottom: 2px solid white;
        }
        .auth-buttons {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .auth-buttons a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .auth-buttons a:hover {
            text-decoration: underline;
        }
        .dropdown-menu {
            background-color: #f44336;
        }
        .dropdown-item {
            color: white;
        }
        .dropdown-item:hover {
            background-color: #e53935;
        }
        .search-icon {
            font-size: 1.5rem;
            color: white;
            cursor: pointer;
            margin-right: 15px;
        }
        .main-content {
        background-color: #f5f5f5;
        font-family: 'Segoe UI', sans-serif;
    }

    .hero-section {
        background: linear-gradient(to right, #2c2c2c, #3e3e3e);
        color: white;
        text-align: center;
        padding: 60px 20px;
    }

    .hero-section h1 {
        color: #ff3b3f;
        font-size: 3rem;
        margin-bottom: 15px;
    }

    .hero-section p {
        font-size: 1.2rem;
        color: #cccccc;
        max-width: 700px;
        margin: 0 auto;
    }

    .haberler {
        padding: 60px 20px;
        max-width: 1200px;
        margin: auto;
    }

    .haberler h2 {
        font-size: 2rem;
        margin-bottom: 30px;
        color: #333;
        text-align: center;
    }

    .haber-karti {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        margin-bottom: 30px;
        transition: transform 0.3s ease;
    }

    .haber-karti:hover {
        transform: translateY(-5px);
    }

    .haber-karti img {
        width: 100%;
        height: 200px;
        object-fit: cover;
    }

    .haber-karti .icerik {
        padding: 20px;
    }

    .haber-karti .icerik h3 {
        margin: 0 0 10px;
        color: #ff3b3f;
    }

    .haber-karti .icerik p {
        color: #666;
        font-size: 0.95rem;
    }

    .haber-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 30px;
    }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <!-- Menü ikonu -->
        <button class="btn text-white me-3">
            <i class="bi bi-list"></i>
        </button>

        <!-- Logo -->
        <a class="navbar-brand" href="#">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/7c/Webtekno_logo.png" alt="Logo">
        </a>

        <!-- Menü linkleri -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('index') }}">ANASAYFA</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">HABER</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">VİDEO</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="kategorilerDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        KATEGORİLER
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="kategorilerDropdown">
                        <li><a class="dropdown-item" href="#">Teknoloji</a></li>
                        <li><a class="dropdown-item" href="#">Oyun</a></li>
                        <li><a class="dropdown-item" href="#">İnceleme</a></li>
                    </ul>
                </li>
            </ul>
        </div>

        <!-- Sağ taraf: Arama, Giriş Yap -->
        <div class="auth-buttons">
            <a href="/login"><i class="bi bi-person"></i> Giriş Yap</a>
            <a href="/register"><i class="bi bi-person"></i> Kayıt Ol </a>
            <a href="/destek"><i class="bi bi-person"></i> Destek Panel </a>
        </div>
    </div>
</nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
